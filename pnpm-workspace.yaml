  - packages/comctx-adapters/examples/*
  - perplexity/*
  - perplexity/extension/cli

catalogs:
  lint:
    eslint: ^9.36.0
    prettier: ^3.6.2
    typescript-eslint: ^8.44.0
  types:
    typescript: ^5.9.2
  shared:
    "@types/node": 22.17.2
    "@types/chrome": 0.1.12
